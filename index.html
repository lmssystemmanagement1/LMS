<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Management System (Offline Mode)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-view" class="view-container">
        <form id="login-form" class="auth-box">
            <h2>LMS Login</h2>
            <div id="login-error" class="error-msg" style="display:none;"></div>
            <label>Email Address</label>
            <input type="email" id="login-email" required value="admin@lms.internal">
            <label>Password</label>
            <input type="password" id="login-password" required value="password123">
            <button type="submit" id="login-btn">Sign In</button>
        </form>
    </div>

    <div id="app-view" class="app-layout" style="display:none;">
        <aside class="sidebar">
            <h2>LMS Administrator</h2>
            <nav>
                <button class="nav-btn active" data-tab="dashboard">Dashboard</button>
                <button class="nav-btn" data-tab="centers">Centers</button>
                <button class="nav-btn" data-tab="barangays">Barangays</button>
                <button class="nav-btn" data-tab="officers">Officers</button>
                <button class="nav-btn" data-tab="clients">Clients</button>
                <button class="nav-btn" data-tab="loans">Loans / Financing</button>
                <button class="nav-btn" data-tab="transactions">Transactions</button>
                <button class="nav-btn" data-tab="audit">Audit Logs</button>
            </nav>
            <button id="logout-btn" class="logout-btn">Logout</button>
        </aside>

        <main class="main-content">
            <div id="alert-box" class="alert" style="display:none;"></div>

            <section id="tab-dashboard" class="tab-content">
                <h1>Main Dashboard</h1>
                <div class="metrics-grid">
                    <div class="card"><p>Total Centers</p><h3 id="m-centers">0</h3></div>
                    <div class="card"><p>Total Barangays</p><h3 id="m-barangays">0</h3></div>
                    <div class="card"><p>Total Officers</p><h3 id="m-officers">0</h3></div>
                    <div class="card"><p>Total Clients</p><h3 id="m-clients">0</h3></div>
                    <div class="card"><p>Active Loans</p><h3 id="m-active-loans">0</h3></div>
                    <div class="card"><p>Pending Applications</p><h3 id="m-pending">0</h3></div>
                    <div class="card"><p>Overdue Loans</p><h3 id="m-overdue">0</h3></div>
                    <div class="card"><p>Outstanding Balance</p><h3 id="m-balance">₱ 0</h3></div>
                </div>
                <div class="actions-box">
                    <h3>Quick Actions</h3>
                    <div class="action-buttons">
                        <button onclick="openModal('center')">+ ADD CENTER</button>
                        <button onclick="openModal('barangay')">+ ADD BARANGAY</button>
                        <button onclick="openModal('officer')">+ ADD OFFICER</button>
                        <button onclick="openModal('client')">+ ADD CLIENT</button>
                        <button onclick="openModal('loan')" class="btn-green">+ NEW LOAN</button>
                        <button onclick="openModal('payment')" class="btn-green">RECORD PAYMENT</button>
                    </div>
                </div>
            </section>

            <section id="tab-centers" class="tab-content" style="display:none;">
                <div class="section-header"><h1>Centers</h1><button onclick="openModal('center')">+ Add Center</button></div>
                <div id="table-centers" class="table-responsive"></div>
            </section>
            <section id="tab-barangays" class="tab-content" style="display:none;">
                <div class="section-header"><h1>Barangays</h1><button onclick="openModal('barangay')">+ Add Barangay</button></div>
                <div id="table-barangays" class="table-responsive"></div>
            </section>
            <section id="tab-officers" class="tab-content" style="display:none;">
                <div class="section-header"><h1>Officers</h1><button onclick="openModal('officer')">+ Add Officer</button></div>
                <div id="table-officers" class="table-responsive"></div>
            </section>
            <section id="tab-clients" class="tab-content" style="display:none;">
                <div class="section-header"><h1>Clients</h1><button onclick="openModal('client')">+ Add Client</button></div>
                <div id="table-clients" class="table-responsive"></div>
            </section>
            <section id="tab-loans" class="tab-content" style="display:none;">
                <div class="section-header"><h1>Loans</h1><button onclick="openModal('loan')">+ New Loan</button></div>
                <div id="table-loans" class="table-responsive"></div>
            </section>
            <section id="tab-transactions" class="tab-content" style="display:none;">
                <div class="section-header"><h1>Transactions</h1></div>
                <div id="table-transactions" class="table-responsive"></div>
            </section>
            <section id="tab-audit" class="tab-content" style="display:none;">
                <div class="section-header"><h1>Audit Logs</h1></div>
                <div id="table-audit" class="table-responsive"></div>
            </section>
        </main>
    </div>

    <div id="modal-overlay" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h3 id="modal-title">Form</h3>
            <form id="dynamic-form"></form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
